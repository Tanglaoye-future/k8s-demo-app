apiVersion: v1
kind: Namespace
metadata:
  name: cicd-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
  namespace: cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-demo
  template:
    metadata:
      labels:
        app: cicd-demo
    spec:
      imagePullSecrets:
        - name: ghcr-secret      # 私有镜像仓库的拉取凭证（在集群中单独创建，不进 Git）
      containers:
        - name: web
          image: ghcr.io/tanglaoye-future/k8s-demo-app:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-demo
  namespace: cicd-demo
spec:
  selector:
    app: cicd-demo
  ports:
    - port: 80
